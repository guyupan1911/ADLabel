name: adlabel

services:
  dev:
    init: true
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        USER_UID: ${HOST_UID:-1000}
        USER_GID: ${HOST_GID:-1000}

    image: adlabel-dev:0.1.0
    container_name: adlabel-dev
    hostname: adlabel-dev

    # Only the project repo is mounted. Build artifacts and ccache live
    # inside the repo (under build/ and .cache/, both gitignored) so they
    # persist across container restarts via the same bind mount.
    volumes:
      - ../:/workspace/ADLabel
      - /team/shared:/team/shared
      - /home/guyu/data/plus_bev:/home/guyu/data/plus_bev

    # host networking simplifies local debugging (gRPC, debuggers, future ROS replay).
    network_mode: host

    # Keep the container alive so dev_into.sh can `docker exec` into it
    # from multiple terminals without races.
    command: sleep infinity
    stdin_open: true
    tty: true
